input:
  image: data/hills.jpg
  palette: null

canvas:
  # Maximum final size. The image keeps its original aspect ratio inside this box.
  size: [8.0, 10.0]
  dpi: 150

image_preprocessor:
  name: bilateral
  filter_size: 9

cluster_labeler:
  name: kmeans
  allow_unused_palette_colors: true

label_processor:
  name: morphological_open_merge
  # Minimum connected paint section area in square inches.
  min_area: 0.005
  # Used by distance_transform_merge and morphological_open_merge.
  min_width_inches: 0.10
  merge_passes: 2
  label_smooth_size: 3
  label_smooth_passes: 2

palette_generator:
  num_colors: 40

output:
  directory: output
  border_thickness: 0
  write_intermediate: true

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
