[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbn-generator"
version = "0.1.0"
description = "Paint-by-numbers image generator with a Python API and Hydra CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
pbn-generator = "pbn_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbn_generator = ["conf/*.yaml"]
